name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Mondays, 03:00 UTC - catches advisories published after the last push.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  code-scan:
    name: Static analysis (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-tools.txt

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-tools.txt

      - name: Run bandit
        run: bandit -c pyproject.toml -r src -f txt

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-tools.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-tools.txt

      # Audits the versions our `>=` constraints actually resolve to today, which is
      # what a fresh `pip install -r requirements.txt` would put on a machine.
      # To accept a triaged advisory, append: --ignore-vuln <ID>  (with a comment saying why)
      - name: Audit declared dependencies
        run: |
          pip-audit \
            --requirement requirements.txt \
            --requirement requirements-tools.txt \
            --progress-spinner=off
