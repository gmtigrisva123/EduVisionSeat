name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-tools.txt

      # Only the tooling: lint and tests never import torch or MediaPipe, so this
      # job stays under a minute instead of downloading the whole runtime stack.
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-tools.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (ruff)
        run: ruff format --check --exclude '*.ipynb' src tests

      - name: Static security scan (bandit)
        run: bandit -c pyproject.toml -r src -q

      - name: Byte-compile sources
        run: python -m compileall -q src tests

      - name: Tests
        run: pytest

  data-hygiene:
    name: No student media in Git
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Classroom images and video are personal data belonging to minors. Once such a
      # file is committed, deleting it later does not remove it from the history, so
      # this gate is the only cheap moment to catch it. See docs/DATA_AND_ETHICS.md.
      - name: Check that no classroom media is tracked
        run: |
          set -uo pipefail
          excluded_dirs=$(git ls-files -- data/images data/videos)
          media=$(git ls-files \
            | grep -Ei '\.(jpe?g|png|bmp|tiff?|mp4|mov|avi|mkv)$' \
            | grep -v '^data/pose/' || true)
          if [ -n "${excluded_dirs}${media}" ]; then
            echo "::error::Student media must never be committed - see docs/DATA_AND_ETHICS.md"
            printf '%s\n' ${excluded_dirs} ${media}
            exit 1
          fi
          echo "No classroom media is tracked."
